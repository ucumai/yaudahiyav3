<style>
:root{--bg:#f3f1ec;--panel:#fff;--ink:#1d2a2e;--mut:#5d6b70;--line:#d9d6cd;--acc:#1f6f5c;--acc2:#e8f1ee;--warn:#8a5a00;--warnbg:#fff4d9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191b;--panel:#1c2326;--ink:#e6ecec;--mut:#9aa8ab;--line:#33403f;--acc:#5fc3a8;--acc2:#1f332e;--warn:#f1c765;--warnbg:#3a3015}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel)}
header h1{font:700 18px/1.2 Georgia,"Times New Roman",serif;margin:0;flex:1;min-width:200px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 14px;border-radius:6px}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
main{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:16px;padding:16px;align-items:start}
@media(min-width:761px){.form{max-height:calc(100vh - 90px);overflow:auto}.stage{position:sticky;top:8px;max-height:calc(100vh - 90px);overflow:auto}}
@media(max-width:760px){main{grid-template-columns:1fr}}
.form{display:flex;flex-direction:column;gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 14px 10px}.card details:last-child{border-bottom:0}
details{border-bottom:1px solid var(--line);padding:8px 0}
summary{font-weight:700;font-size:16px;list-style:none;pointer-events:none;padding:4px 0}summary::-webkit-details-marker{display:none}
.er{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:6px}.er b{width:22px}.er input{flex:1 1 45%;min-width:110px;width:auto}.er button{padding:4px 10px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 2px}
input,textarea,select{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink)}
textarea{resize:vertical;min-height:70px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
small{color:var(--mut);display:block;margin-top:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button[aria-selected=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
.stage{overflow-x:auto}
.paper{background:#fff;color:#000;width:210mm;min-height:297mm;padding:14mm 18mm;margin:0 auto 14px;font:11pt/1.35 Arial,Helvetica,sans-serif;box-shadow:0 1px 6px rgba(0,0,0,.25);position:relative}
.kop{display:flex;gap:12px;align-items:center;border-bottom:3px double #000;padding-bottom:4px;margin-bottom:14px}
.kop .lg{width:70px;height:80px;border:1px dashed #999;display:flex;align-items:center;justify-content:center;font-size:9pt;color:#888;flex:none;overflow:hidden}
.kop .lg img{max-width:100%;max-height:100%}
.kop .tx{flex:1;text-align:center;font-family:"Times New Roman",serif}
.kop .a{font-size:14pt}.kop .s{font:700 20pt Arial;margin:0}.kop .d{font-size:9pt;font-style:italic}
.paper table{border-collapse:collapse;width:100%}
.paper td,.paper th{padding:5px 6px;vertical-align:top}
.grid td,.grid th{border:1px solid #000}.grid th{background:#c9c9c9}
.meta td{padding:0 4px 0 0}
.ttd{margin-left:55%;margin-top:18px}.sp{height:60px}
.paper h3{text-align:center;margin:10px 0 14px;font-size:12pt}
.empty{color:#b00;background:#fff3a0}
.ana{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 20px;line-height:1.55}
.ana h2{font:700 17px Georgia,serif;margin:18px 0 6px}.ana h2:first-child{margin-top:0}
.ana table{border-collapse:collapse;width:100%;font-size:13.5px;display:block;overflow-x:auto}
.ana th,.ana td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}.ana th{background:var(--acc2)}
.warn{background:var(--warnbg);color:var(--warn);padding:8px 12px;border-radius:6px;margin:6px 0}
.hide,.paper.off{display:none}
@media print{
 @page{size:A4;margin:0}
 body{background:#fff}header,.form,.tabs,.ana{display:none!important}
 main{display:block;padding:0}.stage{overflow:visible}
 .paper{zoom:1!important;box-shadow:none;margin:0;page-break-after:always;width:210mm;min-height:297mm}
 .paper.off{display:none}
}
</style>

<body>
<header>
 <h1>Generator Dokumen Pekan Pembinaan</h1>
 <button id="bReset">Reset contoh</button>
 <button id="bPrint">Cetak tab ini</button>
 <button id="bPrintAll" class="p">Cetak semua dokumen</button>
</header>
<main>
<section class="form" id="form" aria-label="Formulir input">
<div class="card"><details open><summary>1. Kegiatan</summary>
 <label>Nama kegiatan</label><input data-k="kegiatan">
 <div class="row"><div><label>Tahun pelajaran</label><input data-k="tp"></div><div><label>Tahun program</label><input data-k="tahunProg"></div></div>
 <div class="row"><div><label>Tanggal</label><input type="date" data-k="tanggal"></div><div><label>Waktu</label><input data-k="waktu" placeholder="12.30 – 14.45 WIB"></div></div>
 <label>Tempat</label><input data-k="tempat">
 <label>Alamat tempat</label><input data-k="alamatTempat">
 <label>Agenda pembahasan / materi</label><input data-k="materi" placeholder="mis. Implementasi Kurikulum Merdeka">
</details>
<details><summary>2. Surat undangan</summary>
 <div class="row"><div><label>Nomor surat</label><input data-k="nomor"></div><div><label>Kota</label><input data-k="kota"></div></div>
 <div class="row"><div><label>Tanggal surat</label><input type="date" data-k="tglSurat"></div><div><label>Lampiran</label><input data-k="lampiran"></div></div>
 <label>Hal</label><input data-k="hal">
 <label>Ditujukan kepada</label><input data-k="kepada">
 <label>Dasar (satu per baris)</label><textarea data-k="dasar" rows="4"></textarea>
 <label>Kelengkapan yang dibawa (satu per baris)</label><textarea data-k="bawa" rows="4"></textarea>
</details>
</div><div class="card"><details open><summary>3. Susunan acara</summary>
 <div id="edAcara"></div>
</details>
<details><summary>4. Pegawai (daftar hadir)</summary>
 <div id="edPeg"></div><small>Isi NIP dengan - untuk honorer. Daftar ini dipakai di daftar hadir dan peserta notula.</small>
</details>
</div><div class="card"><details open><summary>5. Pejabat &amp; notulen</summary>
 <label>Kepala sekolah</label><input data-k="kepsek">
 <div class="row"><div><label>Pangkat</label><input data-k="kepPangkat"></div><div><label>NIP</label><input data-k="kepNip"></div></div>
 <label>Notulen</label><input data-k="notulen">
</details>
<details><summary>6. Notula</summary>
 <label>Agenda rapat</label><input data-k="agendaRapat">
 <label>Unggah PDF bahan materi</label><input type="file" accept="application/pdf" id="pdfIn"><small id="pdfInfo">Belum ada file.</small>
 <label>Teks hasil baca (boleh diedit)</label><textarea id="pdfTxt" rows="6"></textarea>
 <div style="display:flex;gap:6px;margin-top:6px"><button type="button" id="pdfUse">Masukkan ke isi materi</button><button type="button" id="pdfClr">Hapus teks</button></div>
 <label>Pembukaan</label><textarea data-k="nPembukaan" rows="3"></textarea>
 <label>Isi penyampaian materi</label><textarea data-k="nIsi" rows="5"></textarea>
 <label>Penutup</label><textarea data-k="nPenutup" rows="3"></textarea>
</details>
</div>
</section>

<section class="stage">
 <div class="tabs" role="tablist" id="tabs"></div>
 <div id="docs"></div>
 <div id="ana" class="ana hide"></div>
</section>
</main>
